components:
  schemas:
    AdminRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          title: Имя
          maxLength: 50
        surname:
          type: string
          title: Фамилия
          maxLength: 50
        patronymic:
          type: string
          title: Отчество
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 6
        password2:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - email
      - name
      - password
      - password2
      - surname
    AdminSubmissionDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EvaluationResult'
        ok:
          type: boolean
      required:
      - data
      - ok
    AnswerOptionInTask:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
      required:
      - id
      - text
    AnswerOut:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
      required:
      - id
      - text
    CategoryConfigCRUD:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        button_title:
          type: string
          maxLength: 255
        short_description:
          type: string
        detail_description:
          type: string
        category:
          type: integer
      required:
      - button_title
      - category
      - detail_description
      - id
      - short_description
    CategoryMarkup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        color_markup:
          type: integer
        task_category:
          type: integer
        style:
          type: string
          readOnly: true
      required:
      - color_markup
      - id
      - name
      - slug
      - style
      - task_category
    CharacteristicInTask:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicOption'
      required:
      - color
      - id
      - name
      - options
    CharacteristicOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    CharacteristicResult:
      type: object
      properties:
        name:
