components:
  schemas:
    AdminRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          title: Имя
          maxLength: 50
        surname:
          type: string
          title: Фамилия
          maxLength: 50
        patronymic:
          type: string
          title: Отчество
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 6
        password2:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - email
      - name
      - password
      - password2
      - surname
    CookieTokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    StudentRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          title: Имя
          maxLength: 50
        surname:
          type: string
          title: Фамилия
          maxLength: 50
        patronymic:
          type: string
          title: Отчество
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 6
        password2:
          type: string
          writeOnly: true
          minLength: 6
        group:
          type: string
          writeOnly: true
      required:
      - email
      - group
      - name
      - password
      - password2
      - surname
